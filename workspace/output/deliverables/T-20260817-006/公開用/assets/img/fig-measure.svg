<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img" aria-label="調理台の作業スペースの測り方を示した図">
  <style>
    .lbl{font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;font-size:14px;font-weight:700;fill:#1B2A4A}
    .sub{font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;font-size:12.5px;fill:#5b6470}
    .dim{font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;font-size:12.5px;font-weight:700;fill:#C9A24B}
  </style>
  <rect width="700" height="340" fill="#ffffff"/>
  <text x="14" y="26" class="lbl" font-size="15">買う前に測るのは、この2か所だけ</text>
  <text x="14" y="48" class="sub">シンクとコンロの間（作業スペース）の「横幅」と「奥行き」。まな板はこれより小さいものを選びます。</text>

  <!-- キッチン天板（上から見た図） -->
  <g transform="translate(60,80)">
    <rect x="0" y="0" width="580" height="180" rx="6" fill="#f7f9fb" stroke="#c2ccd8" stroke-width="2"/>

    <!-- シンク -->
    <rect x="18" y="24" width="150" height="132" rx="8" fill="#e4eaf0" stroke="#a9b6c4" stroke-width="2"/>
    <circle cx="93" cy="90" r="10" fill="none" stroke="#a9b6c4" stroke-width="2"/>
    <text x="93" y="176" text-anchor="middle" class="sub">シンク</text>

    <!-- コンロ -->
    <rect x="412" y="24" width="150" height="132" rx="8" fill="#e4eaf0" stroke="#a9b6c4" stroke-width="2"/>
    <circle cx="452" cy="66" r="17" fill="none" stroke="#a9b6c4" stroke-width="2"/>
    <circle cx="522" cy="66" r="17" fill="none" stroke="#a9b6c4" stroke-width="2"/>
    <circle cx="487" cy="122" r="14" fill="none" stroke="#a9b6c4" stroke-width="2"/>
    <text x="487" y="176" text-anchor="middle" class="sub">コンロ</text>

    <!-- 作業スペース -->
    <rect x="186" y="24" width="208" height="132" rx="6" fill="#faf3e2" stroke="#C9A24B" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="290" y="86" text-anchor="middle" class="lbl">作業スペース</text>
    <text x="290" y="108" text-anchor="middle" class="sub">ここにまな板を置く</text>

    <!-- 横幅の寸法線 -->
    <g stroke="#C9A24B" stroke-width="1.8">
      <line x1="186" y1="-14" x2="394" y2="-14"/>
      <line x1="186" y1="-20" x2="186" y2="-8"/>
      <line x1="394" y1="-20" x2="394" y2="-8"/>
    </g>
    <text x="290" y="-22" text-anchor="middle" class="dim">① 横幅</text>

    <!-- 奥行きの寸法線 -->
    <g stroke="#C9A24B" stroke-width="1.8">
      <line x1="410" y1="24" x2="410" y2="156"/>
      <line x1="404" y1="24" x2="416" y2="24"/>
      <line x1="404" y1="156" x2="416" y2="156"/>
    </g>
    <text x="424" y="94" class="dim">② 奥行き</text>
  </g>

  <g transform="translate(60,296)">
    <rect x="0" y="0" width="580" height="34" rx="6" fill="#faf3e2" stroke="#e6d5ab" stroke-width="1.5"/>
    <text x="18" y="22" class="sub"><tspan font-weight="700" fill="#1B2A4A">目安：</tspan>まな板は「奥行き −5cm」ほど。はみ出すと使えず、小さすぎると切った具材の置き場に困ります。</text>
  </g>
</svg>
