<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-label="素材別の刃あたりの違いを示した断面図">
  <style>
    .lbl{font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;font-size:14px;font-weight:700;fill:#1B2A4A}
    .sub{font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;font-size:12px;fill:#5b6470}
    .cap{font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;font-size:13px;fill:#5b6470}
  </style>
  <rect width="700" height="300" fill="#ffffff"/>
  <text x="14" y="26" class="lbl" font-size="15">包丁を下ろしたときの、板側の受け止め方</text>
  <text x="14" y="48" class="cap">やわらかい板ほど刃先を受け止め、刃は長持ちします。硬い板は刃先を押し返します。</text>

  <!-- 硬い板 -->
  <g transform="translate(40,88)">
    <text x="130" y="0" text-anchor="middle" class="lbl">硬い板（プラスチック）</text>
    <!-- 包丁 -->
    <path d="M118 20 L142 20 L130 96 Z" fill="#c9d2dc" stroke="#8e9bab" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- 板 -->
    <rect x="0" y="98" width="260" height="46" rx="4" fill="#f2f5f8" stroke="#c2ccd8" stroke-width="2"/>
    <!-- 刃先が入らない＝跳ね返り -->
    <path d="M112 92 L104 78 M148 92 L156 78" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round"/>
    <text x="130" y="170" text-anchor="middle" class="sub">刃先が押し返される</text>
    <text x="130" y="190" text-anchor="middle" class="sub">＝刃が早く傷む</text>
  </g>

  <!-- やわらかい板 -->
  <g transform="translate(400,88)">
    <text x="130" y="0" text-anchor="middle" class="lbl">やわらかい板（ゴム・木）</text>
    <path d="M118 20 L142 20 L130 104 Z" fill="#c9d2dc" stroke="#8e9bab" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- 板：刃先がわずかに沈む -->
    <path d="M0 98 H120 Q130 98 130 106 Q130 98 140 98 H260 V144 H0 Z" fill="#eef4f0" stroke="#9dc0ab" stroke-width="2" stroke-linejoin="round"/>
    <path d="M118 90 Q130 84 142 90" stroke="#137333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="130" y="170" text-anchor="middle" class="sub">刃先をわずかに受け止める</text>
    <text x="130" y="190" text-anchor="middle" class="sub">＝刃が長持ちする</text>
  </g>

  <line x1="350" y1="80" x2="350" y2="270" stroke="#e2e6ec" stroke-width="1.5" stroke-dasharray="4 5"/>
</svg>
