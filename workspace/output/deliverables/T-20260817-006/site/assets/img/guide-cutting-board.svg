<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="4種類のまな板のイラスト">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fb"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <pattern id="woodgrain" width="8" height="60" patternUnits="userSpaceOnUse">
      <rect width="8" height="60" fill="#e8dcc3"/>
      <path d="M2 0 Q4 15 2 30 Q0 45 2 60" stroke="#d3c0a0" stroke-width="1" fill="none"/>
      <path d="M6 0 Q4 20 6 40 Q8 52 6 60" stroke="#dccdb2" stroke-width="0.8" fill="none"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="556" cy="52" r="86" fill="none" stroke="#C9A24B" stroke-opacity=".22" stroke-width="2"/>

  <!-- 木 -->
  <g transform="translate(62,74)">
    <rect x="0" y="0" width="118" height="176" rx="8" fill="url(#woodgrain)" stroke="#b99f77" stroke-width="2"/>
    <circle cx="98" cy="20" r="6" fill="none" stroke="#b99f77" stroke-width="2"/>
    <text x="59" y="200" text-anchor="middle" font-family="-apple-system,'Hiragino Kaku Gothic ProN',sans-serif" font-size="15" font-weight="700" fill="#1B2A4A">木</text>
  </g>

  <!-- プラスチック -->
  <g transform="translate(198,74)">
    <rect x="0" y="0" width="118" height="176" rx="8" fill="#ffffff" stroke="#c2ccd8" stroke-width="2"/>
    <path d="M18 44 L86 44 M24 70 L74 70 M18 96 L92 96 M30 122 L80 122" stroke="#dde3ea" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="98" cy="20" r="6" fill="none" stroke="#c2ccd8" stroke-width="2"/>
    <text x="59" y="200" text-anchor="middle" font-family="-apple-system,'Hiragino Kaku Gothic ProN',sans-serif" font-size="15" font-weight="700" fill="#1B2A4A">プラスチック</text>
  </g>

  <!-- ゴム -->
  <g transform="translate(334,74)">
    <rect x="0" y="0" width="118" height="176" rx="8" fill="#3c4753" stroke="#2b333d" stroke-width="2"/>
    <rect x="0" y="0" width="118" height="176" rx="8" fill="none" stroke="#5a6673" stroke-width="1" stroke-dasharray="3 5"/>
    <circle cx="98" cy="20" r="6" fill="none" stroke="#7d8894" stroke-width="2"/>
    <text x="59" y="200" text-anchor="middle" font-family="-apple-system,'Hiragino Kaku Gothic ProN',sans-serif" font-size="15" font-weight="700" fill="#1B2A4A">ゴム</text>
  </g>

  <!-- エラストマー -->
  <g transform="translate(470,74)">
    <path d="M8 0 H110 A8 8 0 0 1 118 8 V150 Q59 178 0 150 V8 A8 8 0 0 1 8 0 Z" fill="#dfeaf2" stroke="#a9c0d2" stroke-width="2"/>
    <circle cx="98" cy="20" r="6" fill="none" stroke="#a9c0d2" stroke-width="2"/>
    <text x="59" y="200" text-anchor="middle" font-family="-apple-system,'Hiragino Kaku Gothic ProN',sans-serif" font-size="15" font-weight="700" fill="#1B2A4A">エラストマー</text>
  </g>

  <!-- 包丁 -->
  <g transform="translate(200,296)" opacity=".85">
    <path d="M0 14 L150 14 L176 6 L176 22 L150 14" fill="#c9d2dc" stroke="#8e9bab" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="176" y="6" width="66" height="16" rx="7" fill="#1B2A4A"/>
    <circle cx="196" cy="14" r="2" fill="#C9A24B"/>
    <circle cx="210" cy="14" r="2" fill="#C9A24B"/>
  </g>
</svg>
