<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 30px auto; color: #222; padding: 0 16px; }
    h1 { font-size: 18px; } label { display: block; margin: 14px 0 4px; font-size: 13px; }
    input { padding: 6px; width: 220px; } .desc { font-size: 12px; color: #666; }
    .warn { background: #fef7e0; border: 1px solid #f0d58a; border-radius: 8px; padding: 10px; font-size: 12px; color: #7a5200; }
    button { margin-top: 18px; padding: 8px 16px; background: #137333; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    #saved { color: #137333; font-size: 13px; margin-left: 10px; }
  </style>
</head>
<body>
  <h1>Re-Sale AutoSync 設定</h1>
  <div class="warn">
    <b>安全弁</b>：自動購入は金銭が動きます。<b>DRY_RUN が ON の間は実購入・実在庫変更を行いません</b>（記録のみ）。
    本番化は少額・少数で検証し、上限金額を必ず設定してください。無在庫のポリシー抵触リスクは残ります。
  </div>

  <label><input type="checkbox" id="dryRun" /> DRY_RUN（実購入・実在庫変更をしない）</label>
  <label>監視間隔（分）<input id="monitorIntervalMin" type="number" min="1" /></label>
  <div class="desc">短いほど「売れたのに買えない」窓が縮みます（負荷とのトレードオフ）。</div>
  <label>1日の自動購入上限（円）<input id="dailySpendCapJPY" type="number" /></label>
  <label>Amazon販売手数料率<input id="referralRate" type="number" step="0.01" /></label>
  <label>在庫管理ページURL<input id="sellerCentralInventoryUrl" type="text" style="width:100%" /></label>

  <h1 style="font-size:15px;margin-top:26px;">DOMセレクタ（上級・実画面調整用）</h1>
  <div class="desc">セラーセントラル/ヤフオクの画面変更に合わせ、コードを触らず調整できます。空欄で既定に戻ります。</div>
  <label>注文行セレクタ<input id="sel_amazonOrderRow" type="text" style="width:100%" /></label>
  <label>SKU セレクタ<input id="sel_amazonSku" type="text" style="width:100%" /></label>
  <label>在庫行セレクタ<input id="sel_amazonInventoryRow" type="text" style="width:100%" /></label>
  <label>数量入力セレクタ<input id="sel_amazonQtyInput" type="text" style="width:100%" /></label>
  <label>保存ボタンセレクタ<input id="sel_amazonSaveBtn" type="text" style="width:100%" /></label>
  <label>ヤフオク購入ボタン文言（カンマ区切り）<input id="sel_yahooBuyLabels" type="text" style="width:100%" /></label>

  <div><button id="save">保存</button><span id="saved"></span></div>

  <h1 style="font-size:15px;margin-top:26px;">ログ</h1>
  <div class="desc">検証の追跡用に、監視・注文・購入ログをJSONで書き出せます。</div>
  <div><button id="exportLogs" style="background:#5b6673;">ログをJSONでエクスポート</button><span id="exported" style="color:#137333;font-size:13px;margin-left:10px;"></span></div>
  <script src="options.js"></script>
</body>
</html>
